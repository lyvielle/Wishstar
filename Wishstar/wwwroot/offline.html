<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FE8069" />
    <title>💫 Offline – Wishstar</title>
    <link rel="icon" type="image/svg+xml" href="/resources/favicon.svg" />
    <style>
        :root { --primary: #FFB3C6; --primary-ink: #C4506E; --secondary: #FFE5EC; --text: #4A4A4A; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text);
            background: linear-gradient(135deg, #FFF0F3, #FFFAFB);
        }
        .card {
            width: min(100%, 420px); text-align: center; padding: 2.5rem 2rem;
            background: rgba(255, 245, 247, 0.92); border: 1px solid rgba(255, 179, 198, 0.3);
            border-radius: 2rem; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .icon { font-size: 3rem; }
        .logo { color: var(--primary-ink); font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
        p { line-height: 1.5; }
        a {
            display: inline-block; margin-top: 1rem; padding: 0.8rem 2rem; border-radius: 2rem;
            background: var(--primary); color: #fff; font-weight: 600; text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">💫 Wishstar</div>
        <div class="icon" aria-hidden="true">🌙</div>
        <h1>You're offline</h1>
        <p>Wishstar needs an internet connection. Your wishes are safe – try again once you're back online.</p>
        <a href="/wishlist">Try again</a>
    </main>
</body>
</html>
